name: Build mod jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Build
        working-directory: mod_forge_1_20_1
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ancient_power_zone51-jar
          path: mod_forge_1_20_1/build/libs/*.jar
